name: Defense.net
description: 'Defense.Net was a cloud DDoS-mitigation company founded in 2012 by Barrett Lyon (also the
  founder of Prolexic, the original DDoS-mitigation provider). It operated a global constellation of
  scrubbing/mitigation sites that filtered distributed-denial-of-service attacks against Internet-facing
  infrastructure in real time. Bessemer Venture Partners led a $9.5M Series A in 2012. In May 2014 the
  company was acquired by F5 Networks and folded into the F5 Silverline DDoS Protection managed service.
  Defense.Net no longer operates as an independent business: the defense.net domain now returns an HTTP
  301 redirect to the F5 Silverline product page, and there is no independent developer portal, public
  API, documentation, or SDK surface to enrich. This profile is retained as a historical company record
  in the API Evangelist network.'
